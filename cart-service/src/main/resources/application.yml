server:
  port: 8083
spring:
  application:
    name: cart-service
  datasource:
    url: ${MYSQL_URL_CART:jdbc:mysql://localhost:3306/cart_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root123}

  jpa:
    hibernate:
      ddl-auto: update
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
