server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "http://localhost:*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/auth/**
        - id: product-service
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/api/products/**,/api/categories/**
        - id: cart-service
          uri: lb://CART-SERVICE
          predicates:
            - Path=/api/cart/**
        - id: order-service
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/api/orders/**
        - id: payment-service
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/api/payments/**
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/users/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

# Shared JWT secret with auth-service (HS256). Override via env in prod.
jwt:
  secret: ${JWT_SECRET:dev-secret-key-please-override-min-32-chars-1234567890}

# In-memory per-IP rate limits (requests/minute). Env-overridable.
# /api/auth/** uses auth-capacity (brute-force protection); rest use default-capacity.
ratelimit:
  default-capacity: ${RATE_LIMIT_DEFAULT:120}
  auth-capacity: ${RATE_LIMIT_AUTH:20}
  refill-seconds: 60
