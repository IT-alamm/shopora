server:
  port: 8085

spring:
  application:
    name: payment-service
  datasource:
    url: ${MYSQL_URL_PAYMENT:jdbc:mysql://localhost:3306/payment_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root123}

    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# ===== Razorpay TEST mode — use dashboard test keys only =====
# Get from https://dashboard.razorpay.com/app/keys (Test Mode).
# NEVER expose key.secret to frontend. Frontend only gets key.id + razorpay_order_id.
razorpay:
  key:
    id: ${RAZORPAY_KEY_ID:rzp_test_dummy}
    secret: ${RAZORPAY_KEY_SECRET:dummy-secret-change-me}
  webhook:
    secret: ${RAZORPAY_WEBHOOK_SECRET:}
